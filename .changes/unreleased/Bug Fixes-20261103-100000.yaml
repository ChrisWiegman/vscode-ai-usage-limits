kind: Bug Fixes
body: Renew an expired Claude Code OAuth token through the `claude` CLI before fetching usage, and report an expired sign-in instead of an endless "rate limit exceeded" when it cannot be renewed (e.g. when Claude Code runs with `CLAUDE_CODE_OAUTH_TOKEN` and no longer refreshes the stored token)
